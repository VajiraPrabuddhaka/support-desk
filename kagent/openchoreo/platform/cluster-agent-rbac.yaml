# Lets OpenChoreo's cluster agent apply the kinds that agent-kagent and
# agents-kagent render. The cluster agent is what applies a release to the data
# plane, and its own ClusterRole lists kinds one by one, with none of kagent's.
#
# This is the one cluster-wide object of the kagent variant, besides kagent
# itself. Apply it to the data plane cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openchoreo-cluster-agent-kagent
  labels:
    app.kubernetes.io/part-of: support-desk
rules:
  - apiGroups: [api.kagent.dev]
    resources: [agents, harnesses, modelconfigs, remotemcpservers, egresspolicies]
    verbs: ["*"]
  - apiGroups: [ate.dev]
    resources: [workerpools]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openchoreo-cluster-agent-kagent
  labels:
    app.kubernetes.io/part-of: support-desk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openchoreo-cluster-agent-kagent
subjects:
  - kind: ServiceAccount
    name: cluster-agent-dataplane
    namespace: openchoreo-data-plane
