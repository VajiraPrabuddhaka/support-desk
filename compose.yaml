# GeoGrid support desk: two Go agents, the systems they work on, and the MCP
# servers between them. Everything runs locally; only model calls go out, to
# OpenRouter.
#
#   support-triage ──MCP──▶ gitea-mcp ──▶ gitea
#        │ A2A
#        ▼
#   billing-agent  ──MCP──▶ lago-mcp  ──▶ lago-api (+ worker, clock, db, redis, pdf, ui)
#
# Start with `make up`. Values come from .env (`make env` creates it).

name: support-desk

x-lago-image: &lago-image
  image: getlago/api:v1.57.0

# Lago's backend settings, taken from Lago's own docker-compose.yml (v1.57.0)
# without the S3, GCS and SMTP options.
x-lago-env: &lago-env
  DATABASE_URL: postgresql://lago:${LAGO_POSTGRES_PASSWORD:?run make env}@lago-db:5432/lago?search_path=public
  REDIS_URL: redis://lago-redis:6379
  LAGO_REDIS_CACHE_URL: redis://lago-redis:6379
  SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:?run make env}
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  LAGO_RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY:?run make env}
  LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY:?run make env}
  LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY:?run make env}
  LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT:?run make env}
  LAGO_SIDEKIQ_WEB: "false"
  LAGO_USE_AWS_S3: "false"
  LAGO_USE_GCS: "false"
  LAGO_PDF_URL: http://lago-pdf:3000
  LAGO_DATA_API_URL: http://data-api
  LAGO_DISABLE_SEGMENT: "true"
  LAGO_DISABLE_SIGNUP: "true"
  LAGO_DISABLE_PDF_GENERATION: "false"
  LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"
  LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
  # Create the GeoGrid organization, its admin user and its API key on first start.
  LAGO_CREATE_ORG: "true"
  LAGO_ORG_NAME: GeoGrid
  LAGO_ORG_USER_EMAIL: ${LAGO_ADMIN_EMAIL}
  LAGO_ORG_USER_PASSWORD: ${LAGO_ADMIN_PASSWORD:?run make env}
  LAGO_ORG_API_KEY: ${LAGO_API_KEY:?run make env}
  # Public URLs, used in links such as invoice PDFs.
  LAGO_API_URL: http://localhost:${LAGO_API_PORT:-3000}
  LAGO_FRONT_URL: http://localhost:${LAGO_UI_PORT:-3080}

x-agent-image: &agent-image
  image: support-desk-agents:local
  build: .

services:
  # ---------------------------------------------------------------- agents
  support-triage:
    <<: *agent-image
    command: ["support-triage"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-}
      SUPPORT_REPO: ${SUPPORT_REPO:-geogrid/support}
      # gitea-mcp holds the triage bot's token, so the agent needs none.
      GITEA_MCP_URL: http://gitea-mcp:8080/mcp
      BILLING_AGENT_URL: http://billing-agent:8002
      # billing-agent is reached over plain http on the private compose
      # network. Without this, only https or localhost is accepted.
      A2A_ALLOW_HTTP: "true"
      LISTEN_ADDR: ":8001"
      PUBLIC_URL: http://support-triage:8001
    ports:
      - 127.0.0.1:8001:8001
    depends_on:
      seed:
        condition: service_completed_successfully
      gitea-mcp:
        condition: service_started
      billing-agent:
        condition: service_started
    restart: unless-stopped

  billing-agent:
    <<: *agent-image
    command: ["billing-agent"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      BILLING_MODEL: ${BILLING_MODEL:-}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-}
      # lago-mcp holds the Lago API key, so the agent needs none.
      LAGO_MCP_URL: http://lago-mcp:8080/mcp
      LISTEN_ADDR: ":8002"
      PUBLIC_URL: http://billing-agent:8002
    ports:
      - 127.0.0.1:8002:8002
    depends_on:
      seed:
        condition: service_completed_successfully
      lago-mcp:
        condition: service_started
    restart: unless-stopped

  # The support desk console: the web page to see tickets, file new ones and
  # triage them while the agents' steps show up live.
  console:
    <<: *agent-image
    command: ["console"]
    environment:
      LISTEN_ADDR: ":8080"
      SUPPORT_REPO: ${SUPPORT_REPO:-geogrid/support}
      GITEA_URL: http://gitea:3000
      GITEA_PUBLIC_URL: http://localhost:${GITEA_PORT:-3001}
      # Written by seed: the console lists and files tickets as support-inbox.
      GITEA_TOKEN_FILE: /secrets/support-inbox.token
      TRIAGE_AGENT_URL: http://support-triage:8001
      LAGO_API_URL: http://lago-api:3000/api/v1
      LAGO_API_KEY: ${LAGO_API_KEY:?run make env}
      LAGO_PUBLIC_URL: http://localhost:${LAGO_UI_PORT:-3080}
    volumes:
      - agent-secrets:/secrets:ro
    ports:
      - 127.0.0.1:${CONSOLE_PORT:-3030}:8080
    depends_on:
      seed:
        condition: service_completed_successfully
      support-triage:
        condition: service_started
    restart: unless-stopped

  # Fills Gitea and Lago with the scenarios, then exits.
  seed:
    <<: *agent-image
    command: ["seed"]
    environment:
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-gitea-admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?run make env}
      SUPPORT_REPO: ${SUPPORT_REPO:-geogrid/support}
      LAGO_API_URL: http://lago-api:3000
      LAGO_API_KEY: ${LAGO_API_KEY:?run make env}
      SECRETS_DIR: /secrets
    volumes:
      - agent-secrets:/secrets
    depends_on:
      gitea-init:
        condition: service_completed_successfully
      lago-api:
        condition: service_healthy
      lago-worker:
        condition: service_started

  # Sends one message to an agent: `docker compose run --rm ask "Triage ticket #1"`.
  ask:
    <<: *agent-image
    entrypoint: ["ask", "-agent", "http://support-triage:8001"]
    profiles: ["tools"]

  # ------------------------------------------------------------ MCP servers
  gitea-mcp:
    image: docker.gitea.com/gitea-mcp-server:1.13.0
    command: ["/app/gitea-mcp", "-t", "http", "-p", "8080", "-H", "http://gitea:3000"]
    environment:
      # gitea-mcp acts as the triage bot in Gitea, with the token that seed
      # writes. Callers send no credentials.
      GITEA_ACCESS_TOKEN_FILE: /secrets/triage-bot.token
      GITEA_TOOLS: list_issues,issue_read,issue_write,search_issues,label_read
    volumes:
      - agent-secrets:/secrets:ro
    ports:
      - 127.0.0.1:8091:8080
    depends_on:
      gitea:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  lago-mcp:
    # The published image (Nov 2025) predates the credit note, coupon and
    # payment tools, so build Lago's own Dockerfile at a fixed commit.
    image: support-desk-lago-mcp:26bf1c5
    build:
      context: https://github.com/getlago/lago-agent-toolkit.git#26bf1c5c7f5565e154b7ebf76bb5f35f1d182711:mcp
    command: ["sse", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      # lago-mcp calls Lago with this key and URL. Callers send no credentials.
      LAGO_API_KEY: ${LAGO_API_KEY:?run make env}
      LAGO_API_URL: http://lago-api:3000/api/v1
    ports:
      - 127.0.0.1:8092:8080
    depends_on:
      lago-api:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ Gitea
  gitea:
    image: docker.gitea.com/gitea:28.4-rootless
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:${GITEA_PORT:-3001}/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    ports:
      - 127.0.0.1:${GITEA_PORT:-3001}:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Creates the admin account that seed uses, then exits.
  gitea-init:
    image: docker.gitea.com/gitea:28.4-rootless
    entrypoint: ["/bin/sh", "/scripts/create-admin.sh"]
    environment:
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-gitea-admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?run make env}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-gitea-admin@geogrid.example.com}
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - ./infra/gitea/create-admin.sh:/scripts/create-admin.sh:ro
    depends_on:
      gitea:
        condition: service_healthy

  # ------------------------------------------------------------------- Lago
  lago-db:
    image: getlago/postgres-partman:15.0-alpine
    environment:
      POSTGRES_DB: lago
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: ${LAGO_POSTGRES_PASSWORD:?run make env}
      PGDATA: /data/postgres
      POSTGRES_SCHEMA: public
    volumes:
      - lago-db:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago -d lago -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  lago-redis:
    image: redis:7-alpine
    volumes:
      - lago-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  lago-migrate:
    <<: *lago-image
    command: ["./scripts/migrate.sh"]
    environment:
      <<: *lago-env
    depends_on:
      lago-db:
        condition: service_healthy

  lago-api:
    <<: *lago-image
    command: ["./scripts/start.api.sh"]
    environment:
      <<: *lago-env
    volumes:
      - lago-storage:/app/storage
    ports:
      - 127.0.0.1:${LAGO_API_PORT:-3000}:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      start_period: 30s
      start_interval: 2s
      timeout: 60s
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    restart: unless-stopped

  lago-worker:
    <<: *lago-image
    command: ["./scripts/start.worker.sh"]
    environment:
      <<: *lago-env
    volumes:
      - lago-storage:/app/storage
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    restart: unless-stopped

  lago-clock:
    <<: *lago-image
    command: ["./scripts/start.clock.sh"]
    environment:
      <<: *lago-env
    depends_on:
      lago-migrate:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy
    restart: unless-stopped

  lago-pdf:
    image: ghcr.io/getlago/lago-gotenberg:8.39
    restart: unless-stopped

  lago-ui:
    image: getlago/front:v1.57.0
    read_only: true
    tmpfs:
      - /tmp
    environment:
      API_URL: http://localhost:${LAGO_API_PORT:-3000}
      APP_ENV: production
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
      LAGO_DISABLE_PDF_GENERATION: "false"
      LAGO_API_URL: http://localhost:${LAGO_API_PORT:-3000}
      LAGO_FRONT_URL: http://localhost:${LAGO_UI_PORT:-3080}
    ports:
      - 127.0.0.1:${LAGO_UI_PORT:-3080}:8080
    depends_on:
      lago-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent-secrets:
  gitea-data:
  gitea-config:
  lago-db:
  lago-redis:
  lago-storage:
