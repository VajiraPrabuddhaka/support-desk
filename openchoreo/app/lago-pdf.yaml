# Gotenberg, which renders Lago's invoice PDFs. Only lago-api and lago-worker
# call it.
# Order matters: kubectl applies these top to bottom. The ReleaseBinding and the
# Workload exist before the Component, so autoDeploy finds them.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: lago-pdf-development
  namespace: default
spec:
  owner:
    projectName: support-desk
    componentName: lago-pdf
  environment: development
  componentTypeEnvironmentConfigs:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: lago-pdf
  namespace: default
spec:
  owner:
    projectName: support-desk
    componentName: lago-pdf
  endpoints:
    http:
      protocol: HTTP
      port: 3000
  container:
    image: ghcr.io/getlago/lago-gotenberg:8.39
---
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: lago-pdf
  namespace: default
spec:
  owner:
    projectName: support-desk
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
