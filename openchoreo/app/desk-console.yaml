# The support desk console: a web page to see the tickets, file new ones and
# triage them while the agents' steps show up live. It reads and files tickets
# in Gitea as the support-inbox bot, calls support-triage over A2A, and reads
# the customer's account in Lago.
#
# OpenChoreo builds it from this repository on GitHub: a WorkflowRun of
# dockerfile-builder (openchoreo/build/desk-console-build.yaml) builds
# console/Dockerfile, and writes the Component's Workload (desk-console-workload)
# from console/workload.yaml.
#
# Order matters: kubectl applies these top to bottom. The ReleaseBinding exists
# before the Component, so autoDeploy finds it.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: desk-console-development
  namespace: default
spec:
  owner:
    projectName: support-desk
    componentName: desk-console
  environment: development
  workloadOverrides:
    container:
      env:
        # For the "Open in Gitea" and "Open in Lago" links, which the browser
        # opens through the gateway. See gitea.yaml for how the hostnames are made.
        - key: GITEA_PUBLIC_URL
          value: http://http-gitea-development-default-e9dbaee7.openchoreoapis.localhost:19080
        - key: LAGO_PUBLIC_URL
          value: http://http-lago-ui-development-default-01c488b9.openchoreoapis.localhost:19080
---
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: desk-console
  namespace: default
spec:
  owner:
    projectName: support-desk
  componentType:
    kind: ClusterComponentType
    name: deployment/web-application
  autoDeploy: true
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: https://github.com/VajiraPrabuddhaka/support-desk
        revision:
          branch: main
        appPath: /console
      docker:
        context: /
        filePath: /console/Dockerfile
