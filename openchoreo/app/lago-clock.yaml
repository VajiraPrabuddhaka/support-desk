# Lago's clock: it queues Lago's scheduled jobs, such as billing at the end of a
# period, for lago-worker to run.
# Order matters: kubectl applies these top to bottom. The ReleaseBinding and the
# Workload exist before the Component, so autoDeploy finds them.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: lago-clock-development
  namespace: default
spec:
  owner:
    projectName: support-desk
    componentName: lago-clock
  environment: development
  componentTypeEnvironmentConfigs:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 500m, memory: 768Mi}
  workloadOverrides:
    container:
      env:
        - key: LAGO_API_URL
          value: http://http-lago-api-development-default-417fab49.openchoreoapis.localhost:19080
        - key: LAGO_FRONT_URL
          value: http://http-lago-ui-development-default-01c488b9.openchoreoapis.localhost:19080
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: lago-clock
  namespace: default
spec:
  owner:
    projectName: support-desk
    componentName: lago-clock
  dependencies:
    resources:
      - ref: lago-db
        envBindings:
          url: DATABASE_URL
      - ref: lago-redis
        envBindings:
          url: REDIS_URL
  container:
    image: getlago/api:v1.57.0
    command: [./scripts/start.clock.sh]
    env:
      - {key: RAILS_ENV, value: production}
      - {key: RAILS_LOG_TO_STDOUT, value: "true"}
      - {key: LAGO_USE_AWS_S3, value: "false"}
      - {key: LAGO_USE_GCS, value: "false"}
      - {key: LAGO_DATA_API_URL, value: http://data-api}
      - {key: LAGO_DISABLE_SEGMENT, value: "true"}
      - key: SECRET_KEY_BASE
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: secretKeyBase}}
      - key: LAGO_RSA_PRIVATE_KEY
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: rsaPrivateKey}}
      - key: LAGO_ENCRYPTION_PRIMARY_KEY
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: encryptionPrimaryKey}}
      - key: LAGO_ENCRYPTION_DETERMINISTIC_KEY
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: encryptionDeterministicKey}}
      - key: LAGO_ENCRYPTION_KEY_DERIVATION_SALT
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: encryptionKeyDerivationSalt}}
---
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: lago-clock
  namespace: default
spec:
  owner:
    projectName: support-desk
  componentType:
    kind: ClusterComponentType
    name: deployment/worker
  autoDeploy: true
