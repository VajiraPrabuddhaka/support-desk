# Lago's background worker (Sidekiq). It generates invoices and their PDFs, so it
# mounts lago-api's `storage` volume, where lago-api serves the PDFs from.
# Order matters: kubectl applies these top to bottom. The ReleaseBinding and the
# Workload exist before the Component, so autoDeploy finds them.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: lago-worker-development
  namespace: default
spec:
  owner:
    projectName: support-desk
    componentName: lago-worker
  environment: development
  componentTypeEnvironmentConfigs:
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  workloadOverrides:
    container:
      env:
        - key: LAGO_API_URL
          value: http://http-lago-api-development-default-417fab49.openchoreoapis.localhost:19080
        - key: LAGO_FRONT_URL
          value: http://http-lago-ui-development-default-01c488b9.openchoreoapis.localhost:19080
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: lago-worker
  namespace: default
spec:
  owner:
    projectName: support-desk
    componentName: lago-worker
  dependencies:
    resources:
      - ref: lago-db
        envBindings:
          url: DATABASE_URL
      - ref: lago-redis
        envBindings:
          url: REDIS_URL
    endpoints:
      - project: support-desk
        component: lago-pdf
        name: http
        visibility: project
        envBindings:
          address: LAGO_PDF_URL
  container:
    image: getlago/api:v1.57.0
    command: [./scripts/start.worker.sh]
    env:
      - {key: RAILS_ENV, value: production}
      - {key: RAILS_LOG_TO_STDOUT, value: "true"}
      - {key: LAGO_SIDEKIQ_WEB, value: "false"}
      - {key: LAGO_USE_AWS_S3, value: "false"}
      - {key: LAGO_USE_GCS, value: "false"}
      - {key: LAGO_DATA_API_URL, value: http://data-api}
      - {key: LAGO_DISABLE_SEGMENT, value: "true"}
      - {key: LAGO_DISABLE_SIGNUP, value: "true"}
      - {key: LAGO_DISABLE_PDF_GENERATION, value: "false"}
      - {key: LAGO_WEBHOOK_ALLOW_PRIVATE_URLS, value: "false"}
      - {key: LAGO_OAUTH_PROXY_URL, value: https://proxy.getlago.com}
      - key: SECRET_KEY_BASE
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: secretKeyBase}}
      - key: LAGO_RSA_PRIVATE_KEY
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: rsaPrivateKey}}
      - key: LAGO_ENCRYPTION_PRIMARY_KEY
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: encryptionPrimaryKey}}
      - key: LAGO_ENCRYPTION_DETERMINISTIC_KEY
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: encryptionDeterministicKey}}
      - key: LAGO_ENCRYPTION_KEY_DERIVATION_SALT
        valueFrom: {secretKeyRef: {name: support-desk-lago, key: encryptionKeyDerivationSalt}}
---
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: lago-worker
  namespace: default
spec:
  owner:
    projectName: support-desk
  componentType:
    kind: ComponentType
    name: deployment/worker-with-shared-volume
  autoDeploy: true
  parameters:
    sharedVolume:
      component: lago-api
      volume: storage
      mountPath: /app/storage
