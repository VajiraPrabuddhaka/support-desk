# The secrets of the support desk. Their values live in OpenBao under
# secret/support-desk/: scripts/put-secrets.sh writes them from .env, and
# scripts/bootstrap.sh writes the triage bot's Gitea token after seeding.
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: support-desk-openrouter
  namespace: default
spec:
  template:
    type: Opaque
  refreshInterval: 1h
  data:
    - secretKey: apiKey
      remoteRef:
        key: support-desk/openrouter
        property: apiKey
---
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: support-desk-lago
  namespace: default
spec:
  template:
    type: Opaque
  refreshInterval: 1h
  data:
    - secretKey: secretKeyBase
      remoteRef: {key: support-desk/lago, property: secretKeyBase}
    - secretKey: rsaPrivateKey
      remoteRef: {key: support-desk/lago, property: rsaPrivateKey}
    - secretKey: encryptionPrimaryKey
      remoteRef: {key: support-desk/lago, property: encryptionPrimaryKey}
    - secretKey: encryptionDeterministicKey
      remoteRef: {key: support-desk/lago, property: encryptionDeterministicKey}
    - secretKey: encryptionKeyDerivationSalt
      remoteRef: {key: support-desk/lago, property: encryptionKeyDerivationSalt}
    - secretKey: adminPassword
      remoteRef: {key: support-desk/lago, property: adminPassword}
    # The organization's API key. Lago creates the organization with it, and
    # lago-mcp and the console call Lago with it.
    - secretKey: apiKey
      remoteRef: {key: support-desk/lago, property: apiKey}
---
# The triage bot's Gitea token, for gitea-mcp.
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: support-desk-triage-bot
  namespace: default
spec:
  template:
    type: Opaque
  refreshInterval: 1m
  data:
    - secretKey: token
      remoteRef:
        key: support-desk/triage-bot
        property: token
---
# support-inbox's Gitea token, for the console.
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: support-desk-support-inbox
  namespace: default
spec:
  template:
    type: Opaque
  refreshInterval: 1m
  data:
    - secretKey: token
      remoteRef:
        key: support-desk/support-inbox
        property: token
