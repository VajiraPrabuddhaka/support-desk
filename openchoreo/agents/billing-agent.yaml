# billing-agent: answers billing questions from GeoGrid's tickets, working in Lago
# through lago-mcp. support-triage calls it over A2A.
#
# OpenChoreo builds it from this repository on GitHub: a WorkflowRun of
# dockerfile-builder (openchoreo/build/billing-agent-build.yaml) builds
# agents/billing-agent/Dockerfile, and writes the Agent's Workload from
# agents/billing-agent/workload.yaml.
#
# Order matters: kubectl applies these top to bottom. The AgentReleaseBinding
# exists before the Agent, so autoDeploy points it at the first release.
apiVersion: openchoreo.dev/v1alpha1
kind: AgentReleaseBinding
metadata:
  name: billing-agent-development
  namespace: default
spec:
  owner:
    projectName: support-desk
    agentName: billing-agent
  environment: development
  workloadOverrides:
    container:
      env:
        # The model is a choice of the environment, not of the build. Any
        # OpenRouter model with tool calling works, for example a free one such
        # as nvidia/nemotron-3-ultra-550b-a55b:free.
        - {key: OPENROUTER_MODEL, value: nvidia/nemotron-3-ultra-550b-a55b:free}
---
apiVersion: openchoreo.dev/v1alpha1
kind: Agent
metadata:
  name: billing-agent
  namespace: default
spec:
  owner:
    projectName: support-desk
  agentType:
    kind: AgentType
    name: support-desk-agent
  autoDeploy: true

  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: https://github.com/VajiraPrabuddhaka/support-desk
        revision:
          branch: main
        appPath: /agents/billing-agent
      docker:
        context: /
        filePath: /agents/billing-agent/Dockerfile

  # The system prompt is the file prompt.md of the Workload that the build
  # writes. The release freezes its text, and the AgentType hands it to the agent.
  systemPrompt:
    valueFrom:
      workloadFile: prompt.md

  tools:
    mcp:
      - project: support-desk
        component: lago-mcp
        name: mcp
        visibility: project
        envBindings:
          address: LAGO_MCP_URL
        # The tools this agent offers the model; the code keeps the same list.
        tools:
          - get_customer
          - list_customers
          - get_customer_current_usage
          - list_invoices
          - list_customer_invoices
          - get_invoice
          - find_invoice_by_number
          - download_invoice
          - get_fee
          - list_payments
          - list_customer_payments
          - get_payment
          - list_credit_notes
          - get_credit_note
          - list_coupons
          - get_coupon
          - list_applied_coupons
          - list_subscriptions
          - list_customer_subscriptions
          - get_subscription
          - list_plans
          - get_plan
          - void_invoice
          - apply_coupon

  # The billing policy: who may be told what, and the only changes allowed. The
  # image holds agents/billing-agent/skills/billing-policy, pushed from your
  # machine (see openchoreo/README.md). It is pinned by digest in each release
  # and mounted at /skills/billing-policy.
  workspace:
    skills:
      - name: billing-policy
        source:
          oci: host.k3d.internal:10082/support-desk/skills/billing-policy:v1
---
# billing-agent's A2A endpoint, exposed through a2a-http, the type that
# support-desk-agent allows for A2A. The Endpoint is the agent's, so deleting the
# agent deletes it. It asks for project visibility only, which is where
# support-triage calls the agent from: its EndpointReleaseBinding reports the
# agent's in-cluster URL. support-triage still gets that address from tools.a2a.
apiVersion: openchoreo.dev/v1alpha1
kind: Endpoint
metadata:
  name: billing-agent-a2a
  namespace: default
spec:
  owner:
    projectName: support-desk
    agentName: billing-agent
  type:
    kind: EndpointType
    name: a2a-http
  visibility: [project]
  backendRefs:
    - name: billing-agent
      kind: Agent
      agent:
        name: billing-agent
        endpoint: a2a
  autoDeploy: true
