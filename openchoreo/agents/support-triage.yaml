# support-triage: triages GeoGrid's support tickets in Gitea through gitea-mcp,
# and asks billing-agent about billing tickets over A2A.
#
# OpenChoreo builds it from this repository on GitHub: a WorkflowRun of
# dockerfile-builder (openchoreo/build/support-triage-build.yaml) builds
# agents/support-triage/Dockerfile, and writes the Agent's Workload from
# agents/support-triage/workload.yaml.
#
# Order matters: kubectl applies these top to bottom. The AgentReleaseBinding
# exists before the Agent, so autoDeploy points it at the first release.
apiVersion: openchoreo.dev/v1alpha1
kind: AgentReleaseBinding
metadata:
  name: support-triage-development
  namespace: default
spec:
  owner:
    projectName: support-desk
    agentName: support-triage
  environment: development
  workloadOverrides:
    container:
      env:
        # The model is a choice of the environment, not of the build. Any
        # OpenRouter model with tool calling works, for example a free one such
        # as nvidia/nemotron-3-ultra-550b-a55b:free.
        - {key: OPENROUTER_MODEL, value: nvidia/nemotron-3-ultra-550b-a55b:free}
---
apiVersion: openchoreo.dev/v1alpha1
kind: Agent
metadata:
  name: support-triage
  namespace: default
spec:
  owner:
    projectName: support-desk
  agentType:
    kind: AgentType
    name: support-desk-agent
  autoDeploy: true

  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: https://github.com/VajiraPrabuddhaka/support-desk
        revision:
          branch: main
        appPath: /agents/support-triage
      docker:
        context: /
        filePath: /agents/support-triage/Dockerfile

  # The system prompt is the file prompt.md of the Workload that the build
  # writes. The release freezes its text, and the AgentType hands it to the agent.
  systemPrompt:
    valueFrom:
      workloadFile: prompt.md

  tools:
    mcp:
      - project: support-desk
        component: gitea-mcp
        name: mcp
        visibility: project
        envBindings:
          address: GITEA_MCP_URL
        tools: [list_issues, issue_read, issue_write, search_issues, label_read]
    a2a:
      - project: support-desk
        agent: billing-agent
        name: a2a
        visibility: project
        envBindings:
          address: BILLING_AGENT_URL

  # The triage rubric: labels, priorities and the note format. The image holds
  # agents/support-triage/skills/triage-rubric, pushed from your machine (see
  # openchoreo/README.md). It is pinned by digest in each release and mounted at
  # /skills/triage-rubric.
  workspace:
    skills:
      - name: triage-rubric
        source:
          oci: host.k3d.internal:10082/support-desk/skills/triage-rubric:v1
---
# support-triage's A2A endpoint, exposed through a2a-http, the type that
# support-desk-agent allows for A2A. The Endpoint is the agent's, so deleting the
# agent deletes it. It asks for project visibility only, which is where the
# console calls the agent from: its EndpointReleaseBinding reports the agent's
# in-cluster URL. The console still sets that address by hand (TRIAGE_AGENT_URL),
# as a Component cannot depend on an agent yet.
apiVersion: openchoreo.dev/v1alpha1
kind: Endpoint
metadata:
  name: support-triage-a2a
  namespace: default
spec:
  owner:
    projectName: support-desk
    agentName: support-triage
  type:
    kind: EndpointType
    name: a2a-http
  visibility: [project]
  backendRefs:
    - name: support-triage
      kind: Agent
      agent:
        name: support-triage
        endpoint: a2a
  autoDeploy: true
