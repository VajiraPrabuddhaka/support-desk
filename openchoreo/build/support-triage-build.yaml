# Starts a build of support-triage from the latest commit of main on GitHub. The
# build pushes the image and writes the Agent's Workload, support-triage-workload,
# from agents/support-triage/workload.yaml. The Agent then cuts a release from
# it, and autoDeploy binds that release to development.
#
# The workflow and its parameters are the ones in the Agent's spec.workflow. A
# WorkflowRun runs once, so give each new build a new name.
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: support-triage-build-01
  namespace: default
  labels:
    openchoreo.dev/project: support-desk
    openchoreo.dev/agent: support-triage
spec:
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: https://github.com/VajiraPrabuddhaka/support-desk
        revision:
          branch: main
        appPath: /agents/support-triage
      docker:
        context: /
        filePath: /agents/support-triage/Dockerfile
