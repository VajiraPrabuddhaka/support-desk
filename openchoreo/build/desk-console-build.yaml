# Starts a build of the console from the latest commit of main on GitHub. The
# build pushes the image and writes the Component's Workload,
# desk-console-workload, from console/workload.yaml. The Component then cuts a
# release from it, and autoDeploy binds that release to development.
#
# The workflow and its parameters are the ones in the Component's spec.workflow.
# A WorkflowRun runs once, so give each new build a new name.
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: desk-console-build-01
  namespace: default
  labels:
    openchoreo.dev/project: support-desk
    openchoreo.dev/component: desk-console
spec:
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: https://github.com/VajiraPrabuddhaka/support-desk
        revision:
          branch: main
        appPath: /console
      docker:
        context: /
        filePath: /console/Dockerfile
