# Starts a build of billing-agent from the latest commit of main on GitHub. The
# build pushes the image and writes the Agent's Workload, billing-agent-workload,
# from agents/billing-agent/workload.yaml. The Agent then cuts a release from it,
# and autoDeploy binds that release to development.
#
# The workflow and its parameters are the ones in the Agent's spec.workflow. A
# WorkflowRun runs once, so give each new build a new name.
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: billing-agent-build-01
  namespace: default
  labels:
    openchoreo.dev/project: support-desk
    openchoreo.dev/agent: billing-agent
spec:
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: https://github.com/VajiraPrabuddhaka/support-desk
        revision:
          branch: main
        appPath: /agents/billing-agent
      docker:
        context: /
        filePath: /agents/billing-agent/Dockerfile
