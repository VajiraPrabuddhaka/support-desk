# ComponentType for a worker that mounts a volume owned by another component of the
# same project. It is the shipped `worker` ClusterComponentType plus one parameter,
# sharedVolume.
#
# Lago needs it: lago-worker writes invoice PDFs that lago-api serves, so both mount
# the same storage. lago-api owns the volume through the persistent-volume-claim
# trait, which names its claim <metadata.name of lago-api>-<trait instance>. Here
# the same name is computed with oc_generate_name, which is how a component's
# metadata.name is built, so nothing is hard-coded per environment.
#
# The shipped types only allow the traits they list, and none lists a trait for an
# existing volume. A type of our own avoids changing them.
apiVersion: openchoreo.dev/v1alpha1
kind: ComponentType
metadata:
  name: worker-with-shared-volume
  namespace: default
  annotations:
    openchoreo.dev/description: "A worker with no endpoints that mounts a volume owned by another component of its project"
spec:
  workloadType: deployment

  validations:
    - rule: "${size(workload.endpoints) == 0}"
      message: "Workers must not have endpoints."
    - rule: "${parameters.sharedVolume.mountPath.startsWith('/')}"
      message: "sharedVolume.mountPath must be an absolute path."

  parameters:
    openAPIV3Schema:
      type: object
      required: [sharedVolume]
      properties:
        sharedVolume:
          type: object
          required: [component, volume, mountPath]
          properties:
            component:
              type: string
              description: The component that owns the volume through the persistent-volume-claim trait.
            volume:
              type: string
              description: The trait instance name of the volume on that component.
            mountPath:
              type: string
              description: Where to mount the volume in this worker.

  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        replicas:
          type: integer
          default: 1
          minimum: 0
        resources:
          type: object
          default: {}
          properties:
            requests:
              type: object
              default: {}
              properties:
                cpu: {type: string, default: "100m"}
                memory: {type: string, default: "256Mi"}
            limits:
              type: object
              default: {}
              properties:
                cpu: {type: string, default: "1"}
                memory: {type: string, default: "512Mi"}
        imagePullPolicy:
          type: string
          default: IfNotPresent
          enum: [Always, IfNotPresent, Never]

  resources:
    - id: serviceaccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        automountServiceAccountToken: false

    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          replicas: ${environmentConfigs.replicas}
          selector:
            matchLabels: ${metadata.podSelectors}
          template:
            metadata:
              labels: ${metadata.podSelectors}
            spec:
              serviceAccountName: ${metadata.name}
              automountServiceAccountToken: false
              containers:
                - name: main
                  image: ${workload.container.image}
                  imagePullPolicy: ${environmentConfigs.imagePullPolicy}
                  command: |
                    ${has(workload.container.command) ? workload.container.command : oc_omit()}
                  args: |
                    ${has(workload.container.args) ? workload.container.args : oc_omit()}
                  resources:
                    requests:
                      cpu: ${environmentConfigs.resources.requests.cpu}
                      memory: ${environmentConfigs.resources.requests.memory}
                    limits:
                      cpu: ${environmentConfigs.resources.limits.cpu}
                      memory: ${environmentConfigs.resources.limits.memory}
                  env: ${dependencies.toContainerEnvs()}
                  envFrom: ${configurations.toContainerEnvFrom()}
                  volumeMounts: |
                    ${dyn(configurations.toContainerVolumeMounts() + dependencies.toContainerVolumeMounts()) + [
                      {"name": "shared", "mountPath": parameters.sharedVolume.mountPath}]}
              volumes: |
                ${dyn(configurations.toVolumes() + dependencies.toVolumes()) + [
                  {"name": "shared", "persistentVolumeClaim": {"claimName":
                    oc_generate_name(parameters.sharedVolume.component, metadata.environmentName)
                      + "-" + parameters.sharedVolume.volume}}]}

    - id: env-config
      forEach: ${configurations.toConfigEnvsByContainer()}
      var: envConfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${envConfig.resourceName}
          namespace: ${metadata.namespace}
        data: |
          ${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}
    - id: file-config
      forEach: ${configurations.toConfigFileList()}
      var: config
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${config.resourceName}
          namespace: ${metadata.namespace}
        data:
          ${config.name}: |
            ${config.value}
    - id: secret-env-external
      forEach: ${configurations.toSecretEnvsByContainer()}
      var: secretEnv
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${secretEnv.resourceName}
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            name: ${dataplane.secretStore}
            kind: ClusterSecretStore
          target:
            name: ${secretEnv.resourceName}
            creationPolicy: Owner
          data: |
            ${secretEnv.envs.map(secret, {
              "secretKey": secret.name,
              "remoteRef": {
                "key": secret.remoteRef.key,
                ?"property": secret.remoteRef.?property
              }
            })}
    - id: secret-file-external
      forEach: ${configurations.toSecretFileList()}
      var: file
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${file.resourceName}
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            name: ${dataplane.secretStore}
            kind: ClusterSecretStore
          target:
            name: ${file.resourceName}
            creationPolicy: Owner
          data:
            - secretKey: ${file.name}
              remoteRef:
                key: ${file.remoteRef.key}
                property: |
                  ${has(file.remoteRef.property) ? file.remoteRef.property : oc_omit()}
